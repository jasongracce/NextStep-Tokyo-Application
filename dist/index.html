<script>

let welcomeReadyAt=reduced?0:performance.now()+6050;
const progressRing=document.querySelector('.scroll-progress');
const progressFill=progressRing.querySelector('.fill');
let scrollCharge=0,chargeDirection=0,chargeTimer,completionTimer;
function resetScrollProgress(){
  clearTimeout(chargeTimer);clearTimeout(completionTimer);
  scrollCharge=0;chargeDirection=0;
  progressFill.style.strokeDashoffset='100';
  progressRing.classList.remove('visible');
  progressRing.setAttribute('aria-hidden','true');
  progressRing.setAttribute('aria-valuenow','0');
}
function chargeScroll(direction,amount){
  if(performance.now()<welcomeReadyAt||performance.now()<scrollLockedUntil)return;
  if(active+direction<0||active+direction>=sections.length){resetScrollProgress();return;}
  if(chargeDirection!==direction)resetScrollProgress();
  chargeDirection=direction;
  progressRing.classList.toggle('scrolling-up',direction<0);
  clearTimeout(chargeTimer);
  scrollCharge=Math.min(300,scrollCharge+amount);
  const percent=scrollCharge/300*100;
  progressRing.classList.add('visible');progressRing.setAttribute('aria-hidden','false');
  progressRing.setAttribute('aria-valuenow',String(Math.round(percent)));
  progressFill.style.strokeDashoffset=String(100-percent);
  if(scrollCharge===300){
    scrollLockedUntil=performance.now()+(reduced?0:180);
    completionTimer=setTimeout(()=>{scrollLockedUntil=0;scrollSection(direction);resetScrollProgress();},reduced?0:180);
  }else chargeTimer=setTimeout(resetScrollProgress,1800);
}
function atSectionBottom(){
  const pageBottom=window.scrollY+window.innerHeight>=document.documentElement.scrollHeight-4;
  if(active!==1)return pageBottom;
  return pageBottom||document.querySelector('#detail').getBoundingClientRect().bottom<=window.innerHeight-85;
}
function scrollSection(direction){
  if(performance.now()<welcomeReadyAt||performance.now()<scrollLockedUntil)return;
  select(active+direction);
}
window.addEventListener('wheel',event=>{
  if(mobileLayout.matches)return;
  if(event.ctrlKey||Math.abs(event.deltaX)>Math.abs(event.deltaY))return;
  const delta=event.deltaY*(event.deltaMode===1?16:event.deltaMode===2?window.innerHeight:1);
  if(!delta)return;
  const now=performance.now();
  event.preventDefault();
  if(now<welcomeReadyAt||now<scrollLockedUntil)return;
  const atBottom=atSectionBottom();
  if(active===1&&delta>0){
    if(!atBottom){
      resetScrollProgress();
      window.scrollBy({top:delta,left:0,behavior:'instant'});
      return;
    }
    chargeScroll(1,Math.min(Math.abs(delta),80));
    return;
  }

  if(delta<0&&window.scrollY>4){
    resetScrollProgress();
    window.scrollBy({top:delta,left:0,behavior:'instant'});
    return;
  }
  if(delta>0&&!atBottom){
    resetScrollProgress();
    window.scrollBy({top:delta,left:0,behavior:'instant'});
    return;
  }
  chargeScroll(delta>0?1:-1,Math.min(Math.abs(delta),80));
},{passive:false});
let touchStart=null;
window.addEventListener('touchmove',event=>{
  if(mobileLayout.matches)return;
  if(performance.now()<scrollLockedUntil&&event.touches.length===1)event.preventDefault();
},{passive:false});
window.addEventListener('touchstart',event=>{touchStart=event.touches.length===1?{x:event.touches[0].clientX,y:event.touches[0].clientY,scrollY:window.scrollY}:null;},{passive:true});
window.addEventListener('touchend',event=>{
  if(mobileLayout.matches){touchStart=null;return;}
  if(!touchStart||!event.changedTouches.length)return;
  const touch=event.changedTouches[0],dy=touchStart.y-touch.clientY,dx=touchStart.x-touch.clientX;
  const start=touchStart;touchStart=null;
  if(Math.abs(dy)<65||Math.abs(dy)<=Math.abs(dx)||Math.abs(window.scrollY-start.scrollY)>2)return;
  const direction=dy>0?1:-1;
  const atBottom=atSectionBottom();
  if((direction>0&&!atBottom)||(direction<0&&window.scrollY>2))return;
  chargeScroll(direction,Math.abs(dy));
},{passive:true});
let welcomeTimer=setTimeout(()=>document.body.classList.remove('welcome-playing'),6050);
document.querySelector('.skip-welcome').addEventListener('click',()=>{
  clearTimeout(welcomeTimer);
  welcomeReadyAt=0;
  resetScrollProgress();
  document.body.classList.remove('welcome-playing');
  document.body.classList.add('welcome-skipped');
  const heading=document.querySelector('#heading');
  heading.setAttribute('tabindex','-1');
  heading.focus({preventScroll:true});
});

buttons.forEach((button,i)=>button.addEventListener('click',()=>select(i)));document.querySelector('#back').addEventListener('click',()=>select(active-1));document.querySelector('#next').addEventListener('click',()=>select(active+1));document.addEventListener('keydown',event=>{if(event.key==='ArrowRight')select(active+1);if(event.key==='ArrowLeft')select(active-1)});render();
</script>
</body>
</html>
